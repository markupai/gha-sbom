name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never interrupt a main run while it is publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Public repo, so GitHub-hosted runners only: a pull request from a fork must
# never run on the self-hosted ones. Callers exercise the actions on those.
jobs:
  check:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run type-check
      - run: npm test
      - run: npm run package
      - name: dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run npm run package and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  actionlint:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  # Runs the actions from this checkout the way callers use them, on both Linux
  # architectures (syft download differs) and on Windows because the .NET
  # release jobs run there.
  self-test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm, windows-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp
        id: stamp
        uses: ./stamp
        with:
          sbom: test/fixtures/npm.cdx.json
          kind: source
          product: _selftest
          component: gha-sbom
          version: run-${{ github.run_id }}
          subject-path: test/fixtures/artefact.bin
          min-components: "4"

      - name: Check outputs
        shell: bash
        env:
          CDX: ${{ steps.stamp.outputs.cdx }}
          SPDX: ${{ steps.stamp.outputs.spdx }}
          KEY: ${{ steps.stamp.outputs.key }}
        run: |
          test -s "$CDX" && test -s "$SPDX"
          jq -e '.metadata.properties[] | select(.name == "markupai:component" and .value == "gha-sbom")' "$CDX"
          jq -e '.spdxVersion == "SPDX-2.3" and (.creationInfo.comment | contains("markupai:component=gha-sbom"))' "$SPDX"
          [[ "$KEY" == _selftest/gha-sbom/run-* ]]

      # Uploads to the real bucket on main only: the SBOM role trusts main,
      # tags and environments, not PRs. Objects land under _selftest/gha-sbom/
      # and stay locked (GOVERNANCE, 10y) like everything else; a few KB a run.
      # Fork PRs get no id-token, so they stop at the stamp checks above.
      - name: Publish (attest, plus S3 on main)
        if: >-
          matrix.runner == 'ubuntu-26.04' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./publish
        with:
          cdx: ${{ steps.stamp.outputs.cdx }}
          spdx: ${{ steps.stamp.outputs.spdx }}
          key: ${{ steps.stamp.outputs.key }}
          component: gha-sbom
          subject-path: test/fixtures/artefact.bin
          bucket: ${{ github.ref == 'refs/heads/main' && vars.SBOM_BUCKET || '' }}
          role-arn: ${{ github.ref == 'refs/heads/main' && vars.SBOM_ROLE_ARN || '' }}

  release:
    needs: [check, actionlint, self-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write
    steps:
      # No checkout or build with the write token: release the exact tested SHA.
      - name: Publish patch release and update major tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = { ...context.repo, headers: { "X-GitHub-Api-Version": "2026-03-10" } };
            const { data: main } = await github.rest.git.getRef({ ...repo, ref: "heads/main" });
            if (main.object.sha !== context.sha) {
              core.notice("A newer commit is on main; its CI run will release the accumulated changes.");
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags, { ...repo, per_page: 100 });
            const versions = tags.filter((tag) => /^v1\.\d+\.\d+$/.test(tag.name));
            versions.sort((a, b) => b.name.localeCompare(a.name, "en", { numeric: true }));
            const latest = versions[0];
            if (!latest) throw new Error("No stable v1 tag found; bootstrap the release line manually.");
            const existing = versions.find((tag) => tag.commit.sha === context.sha);
            if (existing && existing.name !== latest.name) {
              throw new Error("Refusing to release a commit with an older version tag.");
            }
            const parts = latest.name.slice(1).split(".").map(Number);
            const tag = existing?.name ?? `v1.${parts[1]}.${parts[2] + 1}`;
            if (!existing) {
              await github.rest.git.createRef({ ...repo, ref: `refs/tags/${tag}`, sha: context.sha });
            }

            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
              const previous = versions.find((version) => version.name !== tag);
              const { data: notes } = await github.rest.repos.generateReleaseNotes({
                ...repo, tag_name: tag, target_commitish: context.sha,
                ...(previous ? { previous_tag_name: previous.name } : {}),
              });
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: tag, body: notes.body, draft: false, prerelease: false, make_latest: "true",
              }));
            }
            if (release.draft || release.prerelease) {
              throw new Error(`Refusing to promote unpublished or prerelease ${tag}.`);
            }
            // Only the floating major tag moves; published version tags never do.
            try {
              await github.rest.git.getRef({ ...repo, ref: "tags/v1" });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({ ...repo, ref: "refs/tags/v1", sha: context.sha });
            }
            await github.rest.git.updateRef({ ...repo, ref: "tags/v1", sha: context.sha, force: true });
            const { data: major } = await github.rest.git.getRef({ ...repo, ref: "tags/v1" });
            const { data: published } = await github.rest.repos.getReleaseByTag({ ...repo, tag });
            if (major.object.sha !== context.sha || published.draft || published.prerelease) {
              throw new Error("Release verification failed.");
            }
            core.notice(`Released ${tag}: ${published.html_url}`);
