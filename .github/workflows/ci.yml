name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Self-hosted runners (markupai-runners group) wherever possible. Windows has
# no self-hosted runner, so that self-test leg stays on GitHub-hosted.
jobs:
  check:
    runs-on: markupai-dev-us1-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint:check
      - run: npm run type-check
      - run: npm test
      - run: npm run package
      - name: dist is up to date
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is out of date. Run npm run package and commit the result."
            git diff --stat -- dist
            exit 1
          fi

  actionlint:
    runs-on: markupai-dev-us1-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner image has no Go toolchain.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  # Runs the actions from this checkout the way callers use them, on both
  # self-hosted architectures (syft download differs) and on Windows because
  # the .NET release jobs run there.
  self-test:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        runner: [markupai-dev-us1-amd64, markupai-dev-us1-arm64, windows-latest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp
        id: stamp
        uses: ./stamp
        with:
          sbom: test/fixtures/npm.cdx.json
          kind: source
          product: gha-sbom
          component: self-test
          version: ci-${{ github.run_number }}
          subject-path: test/fixtures/artefact.bin
          min-components: "4"

      - name: Check outputs
        shell: bash
        env:
          CDX: ${{ steps.stamp.outputs.cdx }}
          SPDX: ${{ steps.stamp.outputs.spdx }}
          KEY: ${{ steps.stamp.outputs.key }}
        run: |
          test -s "$CDX" && test -s "$SPDX"
          jq -e '.metadata.properties[] | select(.name == "markupai:component" and .value == "self-test")' "$CDX"
          jq -e '.spdxVersion == "SPDX-2.3" and (.creationInfo.comment | contains("markupai:component=self-test"))' "$SPDX"
          [[ "$KEY" == gha-sbom/self-test/ci-* ]]

      # Uploads to the real bucket on main only: the SBOM role trusts main,
      # tags and environments, not PRs. Objects land under gha-sbom/self-test/
      # and stay locked (GOVERNANCE, 10y) like everything else; a few KB a run.
      # TEMPORARY: prints the OIDC claims (not the token) to compare against the
      # role trust policy, and whether AWS credential env vars are present.
      - name: Debug OIDC claims
        if: matrix.runner == 'markupai-dev-us1-amd64'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");
            const claims = JSON.parse(Buffer.from(token.split(".")[1], "base64url").toString());
            core.info(JSON.stringify({
              iss: claims.iss,
              aud: claims.aud,
              sub: claims.sub,
              repository: claims.repository,
              repository_owner: claims.repository_owner,
              repository_owner_id: claims.repository_owner_id,
              ref: claims.ref,
              environment: claims.environment ?? null,
            }, null, 2));
            const present = Object.keys(process.env).filter((k) => k.startsWith("AWS_")).sort();
            core.info(`AWS_* env present: ${present.join(", ") || "none"}`);

      - name: Publish (attest, plus S3 on main)
        if: matrix.runner == 'markupai-dev-us1-amd64'
        uses: ./publish
        with:
          cdx: ${{ steps.stamp.outputs.cdx }}
          spdx: ${{ steps.stamp.outputs.spdx }}
          key: ${{ steps.stamp.outputs.key }}
          component: self-test
          subject-path: test/fixtures/artefact.bin
          bucket: ${{ github.ref == 'refs/heads/main' && vars.SBOM_BUCKET || '' }}
          role-arn: ${{ github.ref == 'refs/heads/main' && vars.SBOM_ROLE_ARN || '' }}
